<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2484FC"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="10" fill="#F4F7FC"/>

  <!-- Dig -->
  <rect x="24" y="118" width="120" height="70" rx="8" fill="#ffffff" stroke="#0C2460" stroke-width="1.5"/>
  <text x="84" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#0C2460">Dig</text>
  <text x="84" y="170" text-anchor="middle" font-size="11.5" fill="#5a6378">giver opgaven</text>

  <!-- Projektleder -->
  <rect x="270" y="96" width="220" height="114" rx="10" fill="#0C2460"/>
  <text x="380" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#2484FC" letter-spacing="1.5">HOVEDAGENT</text>
  <text x="380" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Projektleder</text>
  <text x="380" y="172" text-anchor="middle" font-size="11.5" fill="#c8d4ee">planlægger, uddelegerer, skriver</text>
  <text x="380" y="196" text-anchor="middle" font-size="11" fill="#c8d4ee">Må: filer og hjælpere · Ikke: nettet</text>

  <!-- Fil -->
  <path d="M628 112 h70 l18 18 v76 h-88 z" fill="#ffffff" stroke="#0C2460" stroke-width="1.5"/>
  <path d="M698 112 v18 h18" fill="none" stroke="#0C2460" stroke-width="1.5"/>
  <text x="672" y="160" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0C2460">udkast.md</text>
  <text x="672" y="180" text-anchor="middle" font-size="11" fill="#5a6378">i mappen</text>

  <!-- Researcher -->
  <rect x="70" y="282" width="230" height="96" rx="10" fill="#ffffff" stroke="#2484FC" stroke-width="2"/>
  <text x="185" y="306" text-anchor="middle" font-size="11" font-weight="700" fill="#2484FC" letter-spacing="1.5">HJÆLPER</text>
  <text x="185" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#0C2460">Researcher</text>
  <text x="185" y="350" text-anchor="middle" font-size="11.5" fill="#5a6378">finder fakta med kilder</text>
  <text x="185" y="368" text-anchor="middle" font-size="11" fill="#5a6378">Må: nettet · Ikke: filer</text>

  <!-- Redaktør -->
  <rect x="460" y="282" width="230" height="96" rx="10" fill="#ffffff" stroke="#2484FC" stroke-width="2"/>
  <text x="575" y="306" text-anchor="middle" font-size="11" font-weight="700" fill="#2484FC" letter-spacing="1.5">HJÆLPER</text>
  <text x="575" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#0C2460">Redaktør</text>
  <text x="575" y="350" text-anchor="middle" font-size="11.5" fill="#5a6378">giver feedback på udkastet</text>
  <text x="575" y="368" text-anchor="middle" font-size="11" fill="#5a6378">Må: kun læse</text>

  <g stroke="#2484FC" stroke-width="2" fill="none" marker-end="url(#pil)">
    <!-- 1 Dig -> PL -->
    <line x1="146" y1="146" x2="266" y2="146"/>
    <!-- 6 PL -> Dig -->
    <line x1="268" y1="170" x2="148" y2="170" stroke-dasharray="5 4"/>
    <!-- 2 PL -> Researcher -->
    <line x1="300" y1="212" x2="210" y2="278"/>
    <!-- Researcher -> PL -->
    <line x1="250" y1="280" x2="330" y2="214" stroke-dasharray="5 4"/>
    <!-- 3 PL -> fil -->
    <line x1="492" y1="152" x2="624" y2="152"/>
    <!-- 4 PL -> Redaktør -->
    <line x1="460" y1="212" x2="550" y2="278"/>
    <!-- Redaktør -> PL -->
    <line x1="510" y1="280" x2="430" y2="214" stroke-dasharray="5 4"/>
  </g>

  <g font-size="11.5" font-weight="700" fill="#0C2460">
    <text x="206" y="138" text-anchor="middle">1. Opgave</text>
    <text x="206" y="188" text-anchor="middle" font-weight="400" fill="#5a6378">6. Svar</text>
    <text x="196" y="236" text-anchor="end">2. Find fakta</text>
    <text x="300" y="262" font-weight="400" fill="#5a6378">fakta</text>
    <text x="558" y="142" text-anchor="middle">3. Gemmer</text>
    <text x="564" y="236">4. Læs udkastet</text>
    <text x="420" y="262" font-weight="400" fill="#5a6378">feedback</text>
    <text x="558" y="172" text-anchor="middle" font-weight="400" fill="#5a6378">5. Retter</text>
  </g>

  <text x="24" y="40" font-size="18" font-weight="700" fill="#0C2460">Tre agenter, ét team</text>
  <text x="24" y="62" font-size="12" fill="#5a6378">Du taler kun med projektlederen. Hjælperne får deres opgaver fra den. Stiplede pile er svar tilbage.</text>
</svg>
